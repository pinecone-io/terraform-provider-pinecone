name: Acceptance Testing

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test:
    name: Terraform Provider Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.0.*'
          - '1.5.*'
          - '1.8.*'
          - '1.10.*'
          - '1.11.*'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@633666f66e0061ca3b725c73b2ec20cd13a8fdd1 # v2.0.3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download
      - env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_CLIENT_ID: ${{ secrets.PINECONE_CLIENT_ID }}
          PINECONE_CLIENT_SECRET: ${{ secrets.PINECONE_CLIENT_SECRET }}
          PINECONE_PROJECT_ID: ${{ secrets.PINECONE_PROJECT_ID }}
          TF_ACC: '1'
        # Explicit -timeout overrides Go's silent 10m default so a slow API
        # response surfaces as a clean per-test failure rather than a binary-wide
        # panic that marks every test failed.
        run: go test -race -covermode=atomic -coverprofile=coverage.out -timeout 15m -v ./pinecone/provider/
        timeout-minutes: 20
