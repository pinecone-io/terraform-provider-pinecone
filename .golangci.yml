# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
version: "2"

linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - copyloopvar
    - forcetypeassert
    - godot
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - usetesting
    - unconvert
    - unparam
    - unused
    - govet
  exclusions:
    rules:
      # The legacy index attributes map one-to-one onto the Index fields go-pinecone v7 deprecates.
      - path: pinecone/models/indexes(_test)?\.go
        linters:
          - staticcheck
        text: 'SA1019: index\.(Metric|VectorType|Dimension|Spec|Embed) is deprecated'

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
